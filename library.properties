sentence=Easy magnetic compass library for QMC5883L and HMC5883L (GY-271): heading 0-360, compass direction in words, rotation calibration. No dependencies.
paragraph=Reads the GY-271 compass over I2C with a one-line begin(): tells QMC5883L from HMC5883L by itself, gives heading(), direction in words (North, South-west) in Russian, Kazakh or English, calibrates the hard-iron and soft-iron error by rotating the board, applies magnetic declination, smooths readings and warns about strong magnets or motors nearby. Needs only the built-in Wire library. Examples included, made for classes, robots and kits by Alash Electronics.
